name: Turso production cutover preflight
on:
  push:
    branches:
      - ops/turso-migration-2026-11-02
    paths:
      - .github/workflows/turso-cutover-preflight.yml
      - tools/verify-turso-cutover.mjs
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Compare all current live content against Turso
        run: node tools/verify-turso-cutover.mjs
