name: Creator OS CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check server/store.js
          node --check server/app.js
      - run: npm test
